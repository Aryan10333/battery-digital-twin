[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-digital-twin"
version = "0.1.0"
description = "EV battery health digital twin: SOH estimation, RUL prognostics, anomaly detection"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
include = ["src*", "data_contracts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
